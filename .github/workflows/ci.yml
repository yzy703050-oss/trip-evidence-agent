name: Native runtime CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r requirements.txt pytest pytest-asyncio jsonschema ruff
      - run: python -m pytest -q tests
      - run: python -m compileall -q trip_assistant cli.py
      - run: python -m ruff check trip_assistant cli.py
      - run: python -m evals.native_runner --output .test-tmp/native-eval
      - name: Secret scan
        run: >-
          ! rg -n '\bsk-[A-Za-z0-9_-]{12,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY'
          -g '!docs/evals/**'

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Keep correctness checks while deferring broad annotation/import modernization.
"agents/**/*.py" = ["E501", "I", "UP", "B", "F401", "F841"]
"context/**/*.py" = ["E501", "I", "UP", "B", "F401", "F841"]
"utils/**/*.py" = ["E501", "I", "UP", "B", "F401", "F841"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
